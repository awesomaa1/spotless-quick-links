<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Spotless Exit Cleaning | Quick Links</title>
  
  <!-- Meta & Social Sharing -->
  <meta name="description" content="Melbourne cleaning, made simple. Book online, via WhatsApp, or call Spotless Exit Cleaning.">
  <meta name="theme-color" content="#f4f1ec">
  <meta property="og:title" content="Spotless Exit Cleaning | Quick Links">
  <meta property="og:description" content="Melbourne cleaning, made simple. Fast, easy and obligation-free.">
  <meta property="og:image" content="assets/hero-photo.png">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Google Fonts: Plus Jakarta Sans + Kaushan Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------------------
       EXACT DESIGN SYSTEM (Extracted from Reference & Official CSS)
       ------------------------------------------------------------- */
    :root {
      --bg-sand: #f4f1ec;              /* Warm linen sand background */
      --color-ink: #0d2a31;            /* Deep dark teal text & borders */
      --color-teal-circle: #153f4d;    /* Avatar background */
      --color-script: #1a7a73;         /* Elegant teal script */
      --color-turquoise-btn: #71eee6;  /* Vibrant primary button */
      --color-muted: #56676b;          /* Subtitle and helper text */
      
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-script: 'Kaushan Script', cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-sand);
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-sand);
      color: var(--color-ink);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: max(44px, env(safe-area-inset-top, 44px)) 24px max(36px, env(safe-area-inset-bottom, 36px)) 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Container: Perfectly sized mobile frame */
    .page-wrapper {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* -------------------------------------------------------------
       1. AVATAR CIRCLE WITH SPOTLESS LOGO
       ------------------------------------------------------------- */
    .avatar-circle {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background-color: var(--color-teal-circle);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 26px;
      box-shadow: 0 4px 16px rgba(13, 42, 49, 0.08);
      user-select: none;
      -webkit-user-select: none;
      padding: 12px;
      position: relative;
    }

    .avatar-wordmark {
      width: 65px;
      height: auto;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.15));
    }

    .avatar-subline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 3px;
      width: 65px;
    }

    .avatar-rule {
      flex: 1;
      height: 1px;
      background-color: rgba(255, 255, 255, 0.7);
    }

    .avatar-subtext {
      font-family: var(--font-script);
      font-size: 6.8px;
      color: #ffffff;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    /* -------------------------------------------------------------
       2. TYPOGRAPHY HEADINGS
       ------------------------------------------------------------- */
    .title-group {
      margin-bottom: 10px;
    }

    .title-main {
      font-size: 38px;
      font-weight: 700;
      color: var(--color-ink);
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    .title-script {
      display: block;
      font-family: var(--font-script);
      font-size: 48px;
      font-weight: 400;
      color: var(--color-script);
      line-height: 1.05;
      margin-top: 1px;
    }

    .subtitle {
      font-size: 15.5px;
      font-weight: 400;
      color: var(--color-muted);
      line-height: 1.4;
      margin-bottom: 32px;
    }

    /* -------------------------------------------------------------
       3. ACTION BUTTONS STACK (4 Targeted Actions)
       ------------------------------------------------------------- */
    .actions-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 700;
      padding: 16.5px 20px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Button 1: Solid Vibrant Turquoise */
    .btn-primary {
      background-color: var(--color-turquoise-btn);
      color: var(--color-ink);
      border: 1.5px solid transparent;
      box-shadow: 0 3px 12px rgba(113, 238, 230, 0.28);
    }
    .btn-primary:hover {
      background-color: #5fe7d9;
      transform: translateY(-1.5px);
      box-shadow: 0 5px 16px rgba(113, 238, 230, 0.4);
    }
    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(113, 238, 230, 0.2);
    }

    /* Outlined Buttons */
    .btn-outline {
      background-color: transparent;
      color: var(--color-ink);
      border: 1.5px solid var(--color-ink);
    }
    .btn-outline:hover {
      background-color: rgba(13, 42, 49, 0.04);
      transform: translateY(-1.5px);
    }
    .btn-outline:active {
      transform: scale(0.98);
      background-color: rgba(13, 42, 49, 0.08);
    }

    /* Micro-copy below buttons */
    .footnote {
      font-size: 14px;
      color: var(--color-muted);
      margin-top: 18px;
      margin-bottom: 40px;
    }

    /* -------------------------------------------------------------
       4. FOLLOW ALONG SOCIAL LINKS
       ------------------------------------------------------------- */
    .follow-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .follow-heading {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-muted);
      margin-bottom: 16px;
    }

    .social-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--color-ink);
      text-decoration: underline;
      text-underline-offset: 3.5px;
      text-decoration-thickness: 1.2px;
      transition: opacity 0.18s ease;
    }
    .social-link:hover {
      opacity: 0.75;
    }
    .social-link:active {
      opacity: 0.55;
    }

    .social-icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <main class="page-wrapper">

    <!-- 1. Top Avatar Circle with Official Brand Logo -->
    <div class="avatar-circle" aria-label="Spotless Exit Cleaning Logo">
      <img src="assets/logo-wordmark.svg" alt="Spotless" class="avatar-wordmark">
      <div class="avatar-subline" aria-hidden="true">
        <span class="avatar-rule"></span>
        <span class="avatar-subtext">exit cleaning</span>
        <span class="avatar-rule"></span>

    </div>

    <!-- 2. Brand Heading -->
    <div class="title-group">
      <h1 class="title-main">Spotless Exit</h1>
      <span class="title-script">Cleaning</span>
    </div>

    <!-- 3. Subtitle -->
    <p class="subtitle">Melbourne cleaning, made simple.</p>

    <!-- 4. Action Buttons Stack -->
    <div class="actions-stack">
      <!-- 1. Book via WhatsApp (Primary Turquoise) -->

        Book via WhatsApp
      </a>

      <!-- 2. Book online (Secondary Outlined) -->
      <a href="https://www.spotlessexitcleaning.com.au/" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
        Book online
      </a>

      <!-- 3. Call Us Directly -->
      <a href="tel:+61413034344" class="btn btn-outline">
        Call 0413 034 344
      </a>

      <!-- 4. Google Reviews -->
      <a href="https://www.google.com/search?sca_esv=e14f145c069ef099&hl=en&authuser=0&sxsrf=AKL5yDiBU-Mf07wm4KFb91fnrcqpQ0g9nw:1795451782058&kgmid=/g/11z_d8pgyj&q=Spotless+Exit+Cleaning&shem=dlvs1,epsd1,esd2e,ltae,rimspwouoe,sdpie&shndl=30&source=sh/x/loc/uni/m1/1&kgs=cc71fab39d886009&utm_source=dlvs1,epsd1,esd2e,ltae,rimspwouoe,sdpie,sh/x/loc/uni/m1/1&zx=1795537160421#lrd=0x9f1a6354ed8c7e9:0xa7df69ef98011964,1,,,," target="_blank" rel="noopener noreferrer" class="btn btn-outline">
        Google Reviews (5.0 ★)
      </a>
    </div>

    <!-- 5. Footnote -->
    <p class="footnote">Fast, easy and obligation-free.</p>

    <!-- 6. Follow Along Socials -->
    <div class="follow-section">
      <div class="follow-heading">Follow along</div>
      <div class="social-row">
        <!-- Instagram -->
        <a href="https://www.instagram.com/spotlessexitcleaning" target="_blank" rel="noopener noreferrer" class="social-link" title="Follow on Instagram">
          <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span>Instagram</span>
        </a>

        <!-- Facebook -->
        <a href="https://www.facebook.com/spotlessexitcleaning" target="_blank" rel="noopener noreferrer" class="social-link" title="Follow on Facebook">
          <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V14.89h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.989C18.343 21.129 22 16.99 22 12c0-5.523-4.477-10-10-10z"/>
          </svg>
          <span>Facebook</span>
        </a>
      </div>
    </div>

  </main>

</body>
</html>
